# Checks, end-to-end tests and the packaged-build smoke test on Windows, macOS and Linux.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      # Unsigned builds: don't look for a signing identity in the macOS keychain.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # Corepack isn't bundled with Node 25+; install it the same way on every version. --force
      # replaces the yarn shim the Windows runner already has.
      - name: Enable Corepack
        run: npm install --global --force corepack@latest && corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Formatting
        if: runner.os == 'Linux'
        run: yarn format:check

      - name: Checks
        run: yarn check

      # Ubuntu's AppArmor blocks the user namespaces Chromium's sandbox needs.
      - name: Allow Chromium's sandbox (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: End-to-end tests
        if: runner.os != 'Linux'
        run: yarn test:e2e

      # The sign-in tests check the session is saved encrypted, which on Linux needs a keyring
      # (without one the app keeps the session in memory only). An unlocked GNOME keyring on a
      # private D-Bus session gives Electron's safeStorage its libsecret backend. turbo.json
      # passes the D-Bus and desktop variables through to the tests.
      - name: End-to-end tests (Linux)
        if: runner.os == 'Linux'
        env:
          XDG_CURRENT_DESKTOP: GNOME
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gnome-keyring dbus-x11
          eval "$(dbus-launch --sh-syntax)"
          echo -n ci | gnome-keyring-daemon --unlock > /dev/null
          export $(gnome-keyring-daemon --start --components=secrets)
          xvfb-run --auto-servernum yarn test:e2e

      # Each e2e test runs the app on its own profile in the temp folder; show what the app logged.
      - name: App logs from failed e2e tests (Linux)
        if: failure() && runner.os == 'Linux'
        run: |
          for log in /tmp/tdc-e2e-*/logs/main.log; do
            [ -f "$log" ] || continue
            echo "::group::$log"
            cat "$log"
            echo "::endgroup::"
          done

      - name: Packaged build
        if: runner.os != 'Linux'
        run: yarn test:packaged

      - name: Packaged build (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum yarn test:packaged

      - name: Keep test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: e2e/test-results
          if-no-files-found: ignore
