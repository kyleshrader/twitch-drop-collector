appId: com.github.twitchdropcollector
productName: Twitch Drop Collector
# The workspace name (@tdc/desktop) isn't a valid file name; installers and paths use this one.
extraMetadata:
  name: twitch-drop-collector
directories:
  buildResources: build
# Only the build output and runtime resources go into the app. package.json is always included.
files:
  - out/**
  - resources/**
  - '!**/*.map'
asarUnpack:
  - resources/**
# Flipped right before signing. See docs/decisions.md (M10).
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
win:
  executableName: twitch-drop-collector
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  # Release builds turn this on when the Apple credentials are set (release.yml).
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  executableName: twitch-drop-collector
  target:
    - AppImage
    - deb
  maintainer: Kyle Shrader
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# Updates come from GitHub Releases. Release builds publish into a draft release for their tag;
# the release workflow publishes it once every platform is in. See docs/decisions.md (M11).
publish:
  provider: github
  owner: kyleshrader
  repo: twitch-drop-collector
  releaseType: draft
# Pre-releases (1.2.0-beta.1) get their own feed file, so stable builds never see them.
generateUpdatesFilesForAllChannels: true
